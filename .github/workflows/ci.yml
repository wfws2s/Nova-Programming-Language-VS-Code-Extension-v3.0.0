name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
            cxx: g++-13
            cc: gcc-13
          - os: ubuntu-latest
            compiler: clang-17
            cxx: clang++-17
            cc: clang-17
          - os: windows-latest
            compiler: msvc
            cxx: cl
            cc: cl
          - os: windows-latest
            compiler: mingw-gcc
            cxx: g++
            cc: gcc
          - os: macos-latest
            compiler: apple-clang
            cxx: clang++
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashley-taylor/configure-ninja-action@v1.0
        with:
          version: '1.11.1'

      - name: Setup Linux Compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc-13" ]; then
            sudo apt-get install -y gcc-13 g++-13
          elif [ "${{ matrix.compiler }}" = "clang-17" ]; then
            sudo apt-get install -y clang-17
          fi

      - name: Configure CMake (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows' && matrix.compiler == 'msvc'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure CMake (Windows MinGW)
        if: runner.os == 'Windows' && matrix.compiler == 'mingw-gcc'
        run: |
          cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        run: |
          ctest --test-dir build -C Release --output-on-failure
